[project]
name = "llm-scripts"
version = "0.1.0"
description = "Вспомогательные скрипты LLM-сервиса: смоук-тест API и управление ключами Bifrost"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "D"]
# RUF001-003: кириллица в строках и докстрингах — норма для проекта, а не «confusables»
ignore = ["D203", "D213", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["api_errors.py", "smoke_test.py", "keys.py", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
