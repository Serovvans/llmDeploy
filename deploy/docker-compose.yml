# Стек LLM-сервиса: docs/design.md §4 (архитектура), §6 (параметры vLLM), §8 (безопасность).
# Переменные обязательны (${VAR:?}): compose интерполирует и сервисы выключенных
# профилей, поэтому пустой пароль Grafana иначе молча превратился бы в admin/admin.
# Исключение — LLM_HOSTNAME и TLS_MODE: на первом этапе развёртывания (§3.7) Caddy не
# запускается и значений ещё нет; их проверяет install.sh при включении профиля gateway.
# То же с PORTAL_LLM_API_KEY: ключ портала выдаёт Bifrost, до второго этапа взять его
# неоткуда. SITE_MODE пустым не бывает: без значения Caddy работает в режиме api.
# SQL_SANDBOX_ROLES — не секрет со значением по умолчанию из docs/portal-api.md §7.4.

# Фиксированное имя проекта: имена volumes (llm_bifrost-data и т. д.) не зависят от
# имени каталога — на них ссылаются бэкап и runbook.
name: llm

# Ротация журналов контейнеров (docs/portal-design.md §8): без неё json-журналы Docker
# растут без предела и заполняют диск ВМ. До 250 МБ на сервис.
x-logging: &logging
  driver: json-file
  options:
    max-size: 50m
    max-file: "5"

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          # Эквивалент --gpus all; синтаксис deploy работает во всех версиях compose v2,
          # в отличие от ключа gpus (появился только в 2.30).
          - driver: nvidia
            count: all
            capabilities: [gpu]

x-vllm: &vllm
  <<: *gpu
  image: vllm/vllm-openai:v0.29.0
  restart: unless-stopped
  logging: *logging
  # PyTorch обменивается тензорами через shared memory; дефолтных 64 МБ /dev/shm мало.
  ipc: host
  environment:
    # Ключ через env, а не --api-key: vLLM читает VLLM_API_KEY сам, и секрет не попадает
    # в список процессов хоста. В `docker inspect` (Config.Env) он по-прежнему виден.
    VLLM_API_KEY: ${VLLM_API_KEY:?}
    HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:?}
  volumes:
    - hf-cache:/root/.cache/huggingface
  networks:
    - inference

services:
  caddy:
    image: caddy:2.11.4
    # Второй этап развёртывания: внешний доступ (§3.7).
    profiles: [gateway]
    restart: unless-stopped
    logging: *logging
    depends_on:
      bifrost:
        condition: service_healthy
    ports:
      # Три порта хоста на один сайт (docs/portal-design.md §3.2); кроме них и SSH ВМ
      # ничего не принимает извне. 443 — доступ по IP в VPN до домена (§3.1).
      - "443:443/tcp"
      # Цель проброса из интернета: 195.122.229.203:18443 → ВМ:8080.
      - "8080:443/tcp"
      # Тот же адрес https://<имя>:18443 из сети заказчика и VPN при внутренней
      # DNS-записи на ВМ — без hairpin NAT на роутере.
      - "18443:443/tcp"
    environment:
      LLM_HOSTNAME: ${LLM_HOSTNAME:-}
      TLS_MODE: ${TLS_MODE:-}
      # portal — третий этап (§3.8): /api/* и статика портала; иначе всё, кроме /v1/*, — 404.
      SITE_MODE: ${SITE_MODE:-api}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Каталогом, а не файлами: в режиме internal файлов сертификата нет, и bind файла
      # не смонтировался бы. В режиме corp здесь fullchain.pem и privkey.pem.
      - ./certs:/certs:ro
      # Корень internal CA: при потере клиентам придётся раздавать новый (§3.4, бэкап).
      - caddy-data:/data
    networks:
      - edge
    healthcheck:
      # Admin API слушает только loopback внутри контейнера — проверка, что Caddy жив,
      # без проверки корпоративного сертификата, которому контейнер не доверяет.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  bifrost:
    image: maximhq/bifrost:v2.2.0
    profiles: [gateway]
    restart: unless-stopped
    logging: *logging
    depends_on:
      vllm:
        condition: service_healthy
    ports:
      # Админ-UI и REST управления ключами — только через SSH-туннель (§3.3, §8).
      # На хосте 8081: 8080 занят пробросом к Caddy (docs/portal-design.md §3.2).
      - "127.0.0.1:8081:8080"
    environment:
      # Подставляются в config.json через префикс "env.".
      VLLM_API_KEY: ${VLLM_API_KEY:?}
      BIFROST_ADMIN_USERNAME: ${BIFROST_ADMIN_USERNAME:?}
      BIFROST_ADMIN_PASSWORD: ${BIFROST_ADMIN_PASSWORD:?}
      BIFROST_ENCRYPTION_KEY: ${BIFROST_ENCRYPTION_KEY:?}
    volumes:
      # SQLite (config.db, logs.db) пишется в volume; config.json Bifrost только читает,
      # поэтому его можно смонтировать read-only поверх того же каталога.
      # В logs.db остаются только метаданные запросов: чаты личные, и содержимое
      # отключено в config.json (disable_content_logging, docs/portal-design.md §8).
      # Там же провайдеру vllm разрешены частные адреса (allow_private_network): без
      # этого Bifrost отказывает в соединении с vLLM, у которого в docker-сети всегда
      # адрес RFC 1918 (docs/design.md §3.3). Адреса заданы в файле, клиент их не меняет.
      - bifrost-data:/app/data
      - ./bifrost/config.json:/app/data/config.json:ro
    networks:
      - edge
      - inference
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  vllm:
    <<: *vllm
    ports:
      # Только loopback: смоук-тест и бенчмарк модели до появления gateway (§3.7, §8).
      # Наружу ВМ порт не выставляется, запрос всё равно требует VLLM_API_KEY.
      - "127.0.0.1:8000:8000"
    command:
      - ${MODEL_ID:?}
      - --served-model-name
      - default
      - --max-model-len
      - ${MAX_MODEL_LEN:?}
      - --gpu-memory-utilization
      - ${GPU_MEM_UTIL:?}
      - --max-num-seqs
      - "32"
      - --limit-mm-per-prompt
      - '{"image": 8}'
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --enable-prefix-caching
    healthcheck:
      # В образе гарантированно есть python; /health vLLM не требует API-ключа.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Первый старт включает скачивание ~30 ГБ весов, затем загрузку в VRAM и
      # компиляцию CUDA-графов — это десятки минут.
      start_period: 60m

  vllm-embed:
    <<: *vllm
    profiles: [embeddings]
    depends_on:
      # Строго после основного: иначе профилировочный прогон одного экземпляра
      # «увидит» память, которую забирает другой (§3.6).
      vllm:
        condition: service_healthy
    command:
      - ${EMBED_MODEL_ID:?}
      # Стабильный алиас, как default у основной модели: config.json Bifrost не
      # меняется при смене EMBED_MODEL_ID.
      - --served-model-name
      - embeddings
      # Явно, чтобы модель с архитектурой *ForCausalLM не поднялась как генеративная.
      - --runner
      - pooling
      # При дефолтных 32k KV-кеш одной последовательности (~3,5 ГБ) вместе с весами
      # не помещается в 0.06 (§3.6).
      - --max-model-len
      - "8192"
      - --port
      - "8001"
      # Сумма долей всех экземпляров ≤ 0.92 — запас на CUDA-контексты (§3.6, §5):
      # 0.85 + 0.06 без реранкера, ~0.81 + 0.06 + ~0.04 с ним (§3.9).
      - --gpu-memory-utilization
      - "0.06"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20m

  # Реранкер поиска по базе знаний портала (§3.9). Наружу не открыт: портал ходит к нему
  # через Bifrost по docker-сети, маршрута /v1/rerank в Caddyfile нет.
  vllm-rerank:
    <<: *vllm
    profiles: [rerank]
    depends_on:
      # Строго по очереди: основная модель → эмбеддинги → реранкер (§3.9). Зависимость
      # от vllm-embed делает профиль embeddings обязательным для профиля rerank.
      vllm-embed:
        condition: service_healthy
    command:
      - ${RERANK_MODEL_ID:?}
      # Стабильный алиас: config.json Bifrost и kb.rerank.model портала не меняются при
      # смене RERANK_MODEL_ID.
      - --served-model-name
      - rerank
      # Явно, как у эмбеддингов: модель не генеративная.
      - --runner
      - pooling
      - --port
      - "8002"
      - --gpu-memory-utilization
      - ${RERANK_GPU_MEM_UTIL:?}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20m

  dcgm-exporter:
    <<: *gpu
    # Вариант ubuntu, а не distroless: в distroless нет shell для healthcheck.
    image: nvcr.io/nvidia/k8s/dcgm-exporter:4.5.2-4.8.1-ubuntu22.04
    profiles: [monitoring]
    restart: unless-stopped
    logging: *logging
    networks:
      - inference
    healthcheck:
      # В образе нет curl/wget, но есть bash с /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/9400 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: [monitoring]
    restart: unless-stopped
    logging: *logging
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # Порт не публикуется: Prometheus читает только Grafana по docker-сети.
    networks:
      - inference
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  grafana:
    image: grafana/grafana:13.2.2
    profiles: [monitoring]
    restart: unless-stopped
    logging: *logging
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      # Только loopback: доступ через SSH-туннель, порт 3000 наружу не открывается (§8).
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - inference
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Выпуск и продление сертификата Let's Encrypt по DNS-01 (docs/portal-design.md §3.2).
  # Разовый запуск: `docker compose --profile cert run --rm lego run ...` — в обычный
  # старт стека не входит, поэтому без restart и healthcheck.
  lego:
    image: goacme/lego:v5.5.2
    profiles: [cert]
    environment:
      # Токен API DNS Timeweb Cloud — только этому сервису. Пустое значение допустимо:
      # compose интерполирует и выключенные профили, а до привязки домена токена нет.
      TIMEWEBCLOUD_AUTH_TOKEN: ${TIMEWEBCLOUD_AUTH_TOKEN:-}
      LEGO_EMAIL: ${ACME_EMAIL:-}
      # Путь задан здесь, а не аргументом: без него состояние осталось бы внутри
      # контейнера, и ключ учётной записи ACME пропал бы вместе с ним.
      LEGO_PATH: /data
    volumes:
      # Каталог хоста, а не volume: scripts/cert.sh раскладывает из него файлы в certs/.
      # Не /lego: в образе это сам исполняемый файл, каталог поверх него не монтируется.
      - ./lego:/data
    # Сети не заданы намеренно: сервис попадает в отдельную сеть default с выходом в
    # интернет и не видит остальные сервисы стека.

  # Третий этап развёртывания: портал сотрудников (§3.8, docs/portal-design.md §3).
  # Образы портала помечаются коммитом релиза: предыдущие остаются на ВМ под своим тегом
  # и служат путём отката без пересборки (docs/portal-design.md §8.2).
  portal-web:
    image: llm-portal-web:${PORTAL_IMAGE_TAG:?}
    build: ../portal/frontend
    profiles: [portal]
    restart: unless-stopped
    logging: *logging
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  portal-api:
    image: llm-portal-api:${PORTAL_IMAGE_TAG:?}
    build: ../portal/backend
    profiles: [portal]
    restart: unless-stopped
    logging: *logging
    depends_on:
      portal-db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      PORTAL_DB_PASSWORD: ${PORTAL_DB_PASSWORD:?}
      PORTAL_SECRET_KEY: ${PORTAL_SECRET_KEY:?}
      PORTAL_LLM_API_KEY: ${PORTAL_LLM_API_KEY:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:?}
      # Та же переменная, с которой запущен vLLM: контекст модели портал берёт только из неё.
      MAX_MODEL_LEN: ${MAX_MODEL_LEN:?}
      # Пароли ролей песочницы SQL; портал требует их только при sql.sandbox.enabled.
      SQL_SANDBOX_PASSWORD: ${SQL_SANDBOX_PASSWORD:?}
      SQL_SANDBOX_CONTROL_PASSWORD: ${SQL_SANDBOX_CONTROL_PASSWORD:?}
      # Только для запасной схемы доступа к реранкеру (docs/portal-api.md §12.1); пустое
      # значение портал считает незаданным и ходит с ключом портала.
      PORTAL_RERANK_API_KEY: ${PORTAL_RERANK_API_KEY:-}
    # Одну строку результата и одно сообщение СУБД из песочницы драйвер принимает
    # целиком, а их размер ограничен только памятью песочницы (512 МБ). Предел оставляет
    # место под две такие проверки разом — сырые байты и строка после разбора — сверх
    # обычного потребления (docs/portal-api.md §7.4). Подкачка запрещена: с ней предел
    # не был бы границей. Значение уточнить на ВМ.
    mem_limit: 4g
    memswap_limit: 4g
    volumes:
      - portal-files:/data/files
      # Каталогом, а не файлом: накладка config.override.yaml необязательна, и bind
      # отсутствующего файла создал бы на его месте каталог.
      - ./portal:/etc/portal:ro
      # Справочник API для помощника и редактора (code.sdk_index_dir); папка SDK и том
      # набора сюда не монтируются (docs/portal-api.md §13.5).
      - cogis-sdk-index:/data/cogis-sdk-index:ro
    networks:
      # Через edge — и Bifrost, и (с 1.0) базы заказчика; песочницы к ним не выходят
      # (docs/portal-api.md §13.5).
      - edge
      - portal
      # От песочницы portal-api не зависит (depends_on нет): без неё проверка SQL
      # получает статус «недоступно», остальное работает.
      - sandbox
      # От песочницы сборки тоже не зависит: без неё сборка — «сборка недоступна».
      - code-sandbox
    healthcheck:
      # curl и wget в образе нет; /healthz отвечает 503, если база недоступна.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  portal-worker:
    # Тот же образ, что у portal-api, с другой командой (docs/portal-design.md §3).
    image: llm-portal-worker:${PORTAL_IMAGE_TAG:?}
    build: ../portal/backend
    profiles: [portal]
    restart: unless-stopped
    logging: *logging
    command: ["portal", "worker"]
    # По SIGTERM воркер возвращает взятые задания в очередь; разбор PDF в потоке
    # прервать нельзя, и стандартных 10 с на это не хватает.
    stop_grace_period: 30s
    depends_on:
      # Миграции применяет portal-api: воркер стартует, когда схема уже готова.
      portal-api:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      # PORTAL_SECRET_KEY сюда не передаётся: ключ второго фактора нужен только portal-api.
      PORTAL_DB_PASSWORD: ${PORTAL_DB_PASSWORD:?}
      PORTAL_LLM_API_KEY: ${PORTAL_LLM_API_KEY:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:?}
      PORTAL_RERANK_API_KEY: ${PORTAL_RERANK_API_KEY:-}
    # Воркер разбирает чужие файлы и запускает на них ffmpeg под своим пользователем
    # (docs/portal-design.md §8.1).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Без дампов памяти: при падении ffmpeg в дампе было бы содержимое чужой записи, при
    # падении воркера — пароль базы и ключи; обработчик хоста положил бы его на диск ВМ.
    # Процессы ffmpeg наследуют предел.
    ulimits:
      core: 0
    # Число потоков распознавания речи — настройка библиотеки, а не граница
    # (docs/portal-design.md §3.4). 10 CPU: 8 потоков речи (media.asr.threads) и 2 —
    # ffmpeg (media.ffmpeg.threads); остальные 6 из 16 vCPU остаются серверам vLLM, базе
    # и бэкенду. 8 ГБ: два экземпляра модели речи по 1–2 ГБ, ffmpeg до 1 ГБ, разбор
    # документов и эмбеддинги документа в памяти. Значения уточнить на ВМ.
    cpus: 10
    mem_limit: 8g
    memswap_limit: 8g
    volumes:
      - portal-files:/data/files
      - ./portal:/etc/portal:ro
      # Веса модели речи (media.asr.model_dir) загружает установка этапа; в работе воркер
      # их только читает и в интернет за ними не обращается.
      - asr-models:/models/asr:ro
    networks:
      # edge — только ради Bifrost: распознавание сканов и эмбеддинги.
      - edge
      - portal
    healthcheck:
      test: ["CMD", "portal", "worker-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  portal-db:
    image: postgres:16.15-bookworm
    profiles: [portal]
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: portal
      POSTGRES_DB: portal
      POSTGRES_PASSWORD: ${PORTAL_DB_PASSWORD:?}
    volumes:
      - portal-db-data:/var/lib/postgresql/data
    networks:
      - portal
    healthcheck:
      # По TCP, а не через сокет: во время первой инициализации временный сервер слушает
      # только сокет, и проверка через него объявила бы базу готовой раньше времени.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "portal", "-d", "portal"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:v1.19.1
    profiles: [portal]
    restart: unless-stopped
    logging: *logging
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?}
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - portal
    healthcheck:
      # В образе нет curl/wget, но есть bash с /dev/tcp; /readyz ключа не требует.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Песочница проверки SQL (docs/portal-design.md §3.3, §8.1; docs/portal-api.md §7.4).
  # Поднимается вместе с порталом и при выключенном флаге sql.sandbox.enabled.
  # Параметры сервера, роли и отключённый вывод сервера — в образе (sql-sandbox/).
  sql-sandbox:
    image: llm-sql-sandbox:${PORTAL_IMAGE_TAG:?}
    build: ./sql-sandbox
    profiles: [portal]
    # Сервер завершается при сбое любого сеанса (restart_after_crash=off); контейнер
    # стартует заново, и tmpfs с каталогом данных создаётся пустым.
    restart: unless-stopped
    # Вывод сервера отключён в образе, журнал контейнера пуст: текст проверяемых
    # операторов не должен оседать на диске ВМ.
    logging: *logging
    environment:
      SQL_SANDBOX_PASSWORD: ${SQL_SANDBOX_PASSWORD:?}
      SQL_SANDBOX_CONTROL_PASSWORD: ${SQL_SANDBOX_CONTROL_PASSWORD:?}
      # Число ролей проверки; не меньше sql.sandbox.max_parallel в конфигурации портала.
      SQL_SANDBOX_ROLES: ${SQL_SANDBOX_ROLES:-2}
    read_only: true
    tmpfs:
      # Данные живут только в памяти и только до перезапуска. uid и gid 999 —
      # пользователь postgres образа: без привилегий сменить владельца нечем.
      - /var/lib/postgresql/data:size=256m,uid=999,gid=999,mode=0700,noexec,nosuid,nodev
      - /var/run/postgresql:size=1m,uid=999,gid=999,mode=0775,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Без дампов памяти: PANIC при заполненном tmpfs — это abort(), и дамп с текстом
    # оператора и данными обработчик хоста положил бы на диск ВМ в обход отключённого
    # вывода сервера.
    ulimits:
      core: 0
    # Жёсткая граница — пределы контейнера, а не параметры сервера: их роль меняет сама.
    # В память входит tmpfs; от неё же зависит предел памяти portal-api. Подкачка
    # запрещена: с ней предел памяти не был бы границей.
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    pids_limit: 64
    networks:
      - sandbox
    healthcheck:
      # По TCP: во время инициализации временный сервер слушает только сокет. Имя роли —
      # чтобы запрос попадал в строку pg_hba.conf; пароль pg_isready не нужен.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "sandbox_ctl", "-d", "sandbox"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Песочница сборки C# (docs/portal-design.md §3.3, §8.5; docs/portal-api.md §7.5.12,
  # §13.5). Всё, что в неё приходит, — враждебный код; секретов и переменных .env нет.
  code-sandbox:
    image: llm-code-sandbox:${PORTAL_IMAGE_TAG:?}
    build:
      context: ../portal/code-sandbox
      target: runtime
    profiles: [portal]
    restart: unless-stopped
    # Журнал сохраняется с ротацией: служба пишет только числа, а вывод процесса
    # компиляции отбрасывает (docs/portal-api.md §7.5.12).
    logging: *logging
    read_only: true
    tmpfs:
      # На диск служба не пишет; /tmp — для служебных файлов среды .NET.
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Без дампов памяти: в дампе был бы исходный код сотрудников.
    ulimits:
      core: 0
    # Две сборки (code.build.max_parallel) — каждая в своём процессе .NET примерно на
    # 20 потоков — и служба. Подкачка запрещена: с ней предел памяти не был бы границей;
    # при нехватке OOM снимает процесс сборки, а не службу. Значения уточнить на ВМ.
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    pids_limit: 256
    volumes:
      # Собственность заказчика: только на ВМ, вне git и образов (docs/portal-design.md §7).
      - ./cogis-sdk:/sdk:ro
      # Индекс пишет только make cogis-sdk разовым запуском index с этим томом на запись.
      - cogis-sdk-index:/index:ro
      - code-packages:/packages:ro
    networks:
      - code-sandbox
    healthcheck:
      # curl и wget в образе нет; /health отвечает 200 и без SDK.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  edge:
  inference:
  # internal: базе и Qdrant выход за пределы сети не нужен (docs/portal-design.md §8).
  portal:
    internal: true
  # Только portal-api и песочница SQL; выхода наружу нет (docs/portal-design.md §8.1).
  sandbox:
    internal: true
  # Только portal-api и песочница сборки; с сетью песочницы SQL не общая
  # (docs/portal-design.md §3).
  code-sandbox:
    internal: true

volumes:
  caddy-data:
  hf-cache:
  bifrost-data:
  prometheus-data:
  portal-db-data:
  qdrant-data:
  portal-files:
  # Веса модели речи: восстановимы загрузкой, в резервную копию не входят.
  asr-models:
  # Индекс SDK и офлайн-набор пакетов восстановимы (make cogis-sdk и цель загрузки
  # набора), в резервную копию не входят (docs/portal-api.md §13.5).
  cogis-sdk-index:
  code-packages:
