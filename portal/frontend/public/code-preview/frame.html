  /* (1) WebRTC: CSP его не закрывает (контракт §7.5.17). */
  ['RTCPeerConnection', 'webkitRTCPeerConnection', 'RTCDataChannel'].forEach(function (name) {
    try {
      Object.defineProperty(window, name, { value: undefined, writable: false, configurable: false });
    } catch (error) {
      window[name] = undefined;
    }
  });

  var parentWindow = window.parent;
  var send = function (message) {
    // The opaque origin cannot name the portal's origin: "*" is the only possible target.
    parentWindow.postMessage(message, '*');
  };

  /* Файл, чей скрипт исполняется сейчас синхронно, и пути всех файлов — чтобы найти место ошибки. */
  var currentFile = null;
  var paths = [];

  function placeFromStack(stack) {
    if (typeof stack !== 'string') {
      return null;
    }
    for (var i = 0; i < paths.length; i += 1) {
      var at = stack.indexOf(paths[i] + ':');
      if (at >= 0) {
        var match = /^:(\d+)(?::(\d+))?/.exec(stack.slice(at + paths[i].length));
        if (match) {
          return { file: paths[i], line: Number(match[1]), column: match[2] ? Number(match[2]) : null };
        }
      }
    }
    return null;
  }

  function reportError(message, error, line, column) {
    var place = currentFile !== null
      ? { file: currentFile, line: line || null, column: column || null }
      : placeFromStack(error && error.stack) || { file: null, line: null, column: null };
    send({ type: 'error', file: place.file, line: place.line, column: place.column, message: String(message).slice(0, 2000) });
  }

  /* (2) Обработчики ошибок и запретов. */
  window.addEventListener('error', function (event) {
    reportError(event.message || (event.error && String(event.error)) || 'Error', event.error, event.lineno, event.colno);
  });
  window.addEventListener('unhandledrejection', function (event) {
    var reason = event.reason;
    var text = reason && reason.message ? (reason.name ? reason.name + ': ' : '') + reason.message : String(reason);
    var saved = currentFile;
    currentFile = null;
    reportError('Uncaught (in promise) ' + text, reason, null, null);
    currentFile = saved;
  });
  document.addEventListener('securitypolicyviolation', function (event) {
    send({ type: 'blocked', url: String(event.blockedURI || '').slice(0, 2000), directive: String(event.effectiveDirective || event.violatedDirective || '') });

  function fixLeafletCss(css) {
    return css.replace(/url\(images\/([A-Za-z0-9-]+\.png)\)/g, function (whole, name) {
      return IMAGES[name] ? 'url("' + IMAGES[name] + '")' : whole;

  function addStyle(text, parent, before) {
    var style = document.createElement('style');
    style.textContent = text;
    parent.insertBefore(style, before || null);
  }

  /** Скрипт с текстом; у файла проекта — пустые строки до его начала в файле и `sourceURL`, чтобы строки совпали. */
  function runScript(text, path, startLine, parent, before, attributes) {
    var script = document.createElement('script');
    (attributes || []).forEach(function (attribute) {
      script.setAttribute(attribute.name, attribute.value);
    });
    script.text = path === null ? text : new Array(startLine).join('\n') + text + '\n//# sourceURL=' + path;
    var saved = currentFile;
    currentFile = path;
    (parent || document.body).insertBefore(script, before || null);
    currentFile = saved;
  }

  var JS_TYPES = ['', 'text/javascript', 'application/javascript', 'module', 'text/ecmascript', 'application/ecmascript'];

  /** Разметка файла: узлы вставляются, скрипты пересоздаются по порядку — `innerHTML` их не исполняет. */

    template.innerHTML = html;
    var nodes = Array.prototype.slice.call(template.content.childNodes);
    var holder = document.createDocumentFragment();
    nodes.forEach(function (node) {
      holder.appendChild(node);
    });
    var scripts = Array.prototype.slice.call(holder.querySelectorAll('script'));
    var marks = scripts.map(function (script) {
      var mark = document.createComment('');
      script.parentNode.replaceChild(mark, script);
      return { mark: mark, script: script };
    });
    parent.insertBefore(holder, before || null);
    var from = 0;
    marks.forEach(function (item) {
      var source = item.script;
      var type = (source.getAttribute('type') || '').toLowerCase();
      if (JS_TYPES.indexOf(type) < 0) {
        item.mark.parentNode.replaceChild(source, item.mark);
        return;
      }
      var at = html.indexOf(source.text, from);
      var startLine = at >= 0 ? html.slice(0, at).split('\n').length : 1;
      from = at >= 0 ? at + source.text.length : from;
      runScript(source.text, path, startLine, item.mark.parentNode, item.mark, Array.prototype.slice.call(source.attributes));
      item.mark.parentNode.removeChild(item.mark);
    });
  }

  function withHelpers(list) {
    list.first = function (predicate) {
      for (var i = 0; i < list.length; i += 1) {
        if (!predicate || predicate(list[i])) {
          return list[i];
        }
      }
      return undefined;
    };
    list.where = function (predicate) {
      return withHelpers(list.filter(function (item) {
        return predicate(item);
      }));
    };
    list.addArray = function (items) {
      (items || []).forEach(function (item) {
        list.push(item);
      });
      return list;
    };
    return list;
  }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) {
      node.className = className;
    }
    if (text !== undefined) {
      node.textContent = text;
    }
    return node;
  }

  function showAlert(title, message) {
    var backdrop = el('div', 'pv-alert-backdrop');
    var box = el('div', 'pv-alert');
    box.setAttribute('role', 'alertdialog');
    box.appendChild(el('h2', '', title === undefined ? '' : String(title)));
    box.appendChild(el('p', '', message === undefined ? '' : String(message)));
    var close = el('button', 'pv-button', 'Закрыть');
    close.type = 'button';
    close.addEventListener('click', function () {
      backdrop.remove();
    });
    box.appendChild(close);
    backdrop.appendChild(box);
    document.body.appendChild(backdrop);
    close.focus();
  }

  function start(init) {
    var files = Array.isArray(init.files) ? init.files : [];
    paths = files.map(function (file) {
      return String(file.path);
    });
    var features = init.layer && init.layer.features && Array.isArray(init.layer.features.features) ? init.layer.features.features : [];
    var functions = Array.isArray(init.api_functions) ? init.api_functions : [];
    var libraries = init.libraries || {};

    /* (4) Библиотеки клиента CoGIS. */
    if (typeof libraries.leaflet_css === 'string') {
      addStyle(fixLeafletCss(libraries.leaflet_css), document.head);
    }
    ['jquery', 'knockout', 'leaflet'].forEach(function (id) {
      if (typeof libraries[id] === 'string') {
        runScript(libraries[id], null);
      }
    });
    if (window.L && window.L.Icon && window.L.Icon.Default) {
      window.L.Icon.Default.imagePath = '';
      window.L.Icon.Default.mergeOptions({ iconUrl: IMAGES['marker-icon.png'], iconRetinaUrl: IMAGES['marker-icon-2x.png'], shadowUrl: IMAGES['marker-shadow.png'] });
    }

    /* (5) Заглушка api (А-131). */
    var layer = Object.freeze({ name: init.layer && init.layer.name ? String(init.layer.name) : 'Слой предпросмотра' });
    function objects() {
      return withHelpers(features.map(function (feature) {
        var attributes = {};
        Object.keys(feature.properties || {}).forEach(function (key) {
          attributes[key] = feature.properties[key];
        });
        return { attributes: attributes, geometry: feature.geometry || null };
      }));
    }
    function describe(value, depth) {
      if (value === layer) {
        return 'слой предпросмотра';
      }
      if (typeof value === 'string') {
        return JSON.stringify(value);
      }
      if (typeof value === 'number' || typeof value === 'boolean' || value === null || value === undefined) {
        return String(value);
      }
      if (typeof value === 'function') {
        return 'функция';
      }
      if (Array.isArray(value)) {
        return depth > 0 ? '[…]' : '[' + value.slice(0, 20).map(function (item) { return describe(item, 1); }).join(', ') + (value.length > 20 ? ', …' : '') + ']';
      }
      if (value.type === 'point') {
        var sr = value.spatialReference;
        var id = sr && typeof sr === 'object' ? (sr.wkid !== undefined ? sr.wkid : 'WKT') : sr;
        return 'точка ' + value.x + '; ' + value.y + (id !== undefined && id !== null ? ' (' + id + ')' : '');
      }
      return '{…}';
    }
    var SYMBOLS = ['createSimplePointSymbol', 'createPicturePointSymbol', 'createSimpleLineSymbol', 'createSimpleFillSymbol'];
    function call(name, args) {
      switch (name) {
        case 'createPoint':
          return { type: 'point', x: args[0], y: args[1], spatialReference: args[2] };
        case 'createExtent':
          return { type: 'extent', xmin: args[0], xmax: args[1], ymin: args[2], ymax: args[3], spatialReference: args[4] };
        case 'getSpatialReference':
          return typeof args[0] === 'number' ? { wkid: args[0] } : { wkt: args[0] };
        case 'getCentroid':
        case 'project':
          return args[0];
        case 'createColor':
          return { r: args[0], g: args[1], b: args[2], alpha: args[3] };
        case 'addGraphic':
          return { graphic: true };
        case 'getLayer':
          return layer;
        case 'searchInLayer':
          return Promise.resolve(objects());
        case 'showAlert':
          showAlert(args[0], args[1]);
          return undefined;
        default:
          return SYMBOLS.indexOf(name) >= 0 ? { type: name, arguments: args } : undefined;
      }
    }
    window.api = new Proxy({}, {
      get: function (target, name) {
        // `then` is probed by `await api`; it is not a function of api and is not logged.
        if (typeof name !== 'string' || name === 'then') {
          return undefined;
        }
        return function () {
          var args = Array.prototype.slice.call(arguments);
          var known = functions.indexOf(name) >= 0;
          var count = known && (name === 'getLayer' || name === 'searchInLayer') ? features.length : null;
          send({ type: 'log', fn: name, args: args.slice(0, 20).map(function (arg) { return describe(arg, 0).slice(0, 2000); }), known: known, count: count });
          return known ? call(name, args) : undefined;
        };
      },
    });

    /* (6) Каркас вида и файлы проекта. */
    var kind = init.kind;
    var file = files[0];
    if (kind === 'js_plugin' && file) {
      var panel = el('section', 'pv-panel');
      panel.appendChild(el('h1', 'pv-panel-title', 'Кнопка плагина'));
      var body = el('div', 'pv-panel-body');
      var run = el('button', 'pv-button', 'Запустить плагин');
      run.type = 'button';
      run.addEventListener('click', function () {
        runScript(String(file.content), String(file.path), 1);
      });
      body.appendChild(run);
      panel.appendChild(body);
      document.body.appendChild(panel);
    } else if (kind === 'html_widget' && file) {
      var widget = el('section', 'pv-panel');
      widget.appendChild(el('h1', 'pv-panel-title', 'Виджет'));
      var content = el('div', 'pv-panel-body');
      widget.appendChild(content);
      document.body.appendChild(widget);
      insertHtml(String(file.content), String(file.path), content);
      if (window.ko && typeof window.ko.applyBindings === 'function') {
        try {
          window.ko.applyBindings({}, content);
        } catch (error) {
          send({ type: 'error', file: String(file.path), line: null, column: null, message: String(error && error.message ? error.message : error).slice(0, 2000) });
        }
      }
    } else if (kind === 'catalog') {
      document.body.appendChild(el('h1', 'pv-catalog-title', 'Каталог карт'));
      [['Folder_1', 'Папка 1'], ['Folder_2', 'Папка 2'], ['Folder_3', 'Папка 3'], ['Map_1', 'Карта 1'], ['Map_2', 'Карта 2']].forEach(function (item) {
        var block = el('div', 'catalog-items-container', item[1]);
        block.setAttribute('data-block-id', item[0]);
        document.body.appendChild(block);
      });
      files.forEach(function (item) {
        var placement = item.catalog || { insertion: 'body_end', clients: ['smartphone', 'tablet', 'desktop'] };
        if (placement.clients.indexOf(init.client) < 0) {
          return;
        }
        var inHead = placement.insertion === 'head_start' || placement.insertion === 'head_end';
        var parent = inHead ? document.head : document.body;
        var before = placement.insertion === 'head_start' || placement.insertion === 'body_start' ? parent.firstChild : null;
        var path = String(item.path);
        var text = String(item.content);
        var extension = path.slice(path.lastIndexOf('.') + 1).toLowerCase();
        if (extension === 'css') {
          addStyle(text, parent, before);
        } else if (extension === 'js') {
          runScript(text, path, 1, parent, before);
        } else {
          insertHtml(text, path, parent, before);
        }
      });
    } else if (kind === 'card_hooks' && file) {
      var hidden = el('div');
      hidden.hidden = true;
      document.body.appendChild(hidden);
      insertHtml(String(file.content), String(file.path), hidden);
      var first = features[0] || { properties: {} };
      var values = {};
      var ko = window.ko;
      Object.keys(first.properties || {}).forEach(function (key) {
        var value = first.properties[key];
        values[key] = ko && ko.observable ? ko.observable(value) : (function (current) {
          var read = function () { return current; };
          read.set = function (next) { current = next; };
          return read;
        })(value);
      });
      var object = {
        attributes: function () {
          return {
            keyValues: withHelpers(Object.keys(values).map(function (key) {
              return { key: key, value: values[key]() };
            })),
            get: function (name) {
              return values[name];
            },
          };
        },
        id: { layerId: 0 },
        service: { isApplicable: function () { return true; } },
      };
      var project = {};
      var read = function (result) {
        return typeof result === 'function' ? result() : result;
      };
      var card = el('section', 'pv-panel pv-card');
      card.appendChild(el('h1', 'pv-panel-title', 'Карточка объекта (образец)'));
      var cardBody = el('div', 'pv-panel-body');
      Object.keys(values).forEach(function (key, index) {
        var row = el('div', 'pv-field');
        var label = el('label', '', key);
        label.htmlFor = 'pv-field-' + index;
        var input = el('input');
        input.id = 'pv-field-' + index;
        input.value = values[key]() === null || values[key]() === undefined ? '' : String(values[key]());
        input.addEventListener('input', function () {
          if (values[key].set) {
            values[key].set(input.value);
          } else {
            values[key](input.value);
          }
        });
        row.appendChild(label);
        row.appendChild(input);
        cardBody.appendChild(row);
      });
      var result = el('p', 'pv-result');
      result.setAttribute('role', 'status');
      var actions = el('div', 'pv-actions');
      var save = el('button', 'pv-button', 'Сохранить');
      save.type = 'button';
      save.addEventListener('click', function () {
        var errors = typeof window.checkBeforeSave === 'function' ? read(window.checkBeforeSave(object, project)) : null;
        var list = Array.isArray(errors) ? errors : errors ? [errors] : [];
        result.textContent = list.length > 0 ? 'Ошибки проверки: ' + list.map(String).join('; ') : 'Проверка пройдена — CoGIS сохранил бы объект';
      });
      actions.appendChild(save);
      ['Задача 1', 'Задача 2'].forEach(function (caption) {
        var button = { caption: caption };
        var task = el('button', 'pv-button', caption);
        task.type = 'button';
        var visible = typeof window.checkButtonVisibilityInCard === 'function' ? read(window.checkButtonVisibilityInCard(object, button, project)) : true;
        if (visible === false) {
          task.className = 'pv-button pv-button-hidden';
          task.textContent = caption + ' — скрыта кодом';
        }
        task.addEventListener('click', function () {
          var allowed = typeof window.checkBeforeExecuteButtonInCard === 'function' ? read(window.checkBeforeExecuteButtonInCard(object, button, project)) : true;
          result.textContent = allowed === false ? 'Задача не запустилась бы: код вернул false' : 'Задача запустилась бы';
        });
        actions.appendChild(task);
      });
      cardBody.appendChild(actions);
      cardBody.appendChild(result);
      card.appendChild(cardBody);
      document.body.appendChild(card);
    }
  }

  /* (3) Готовность и одно сообщение init от родителя; дальше сообщения не принимаются. */
  var started = false;
  window.addEventListener('message', function onInit(event) {
    if (started || event.source !== parentWindow || !event.data || event.data.type !== 'init') {
      return;
    }
    started = true;
    window.removeEventListener('message', onInit);
    start(event.data);
  });
  send({ type: 'ready' });
