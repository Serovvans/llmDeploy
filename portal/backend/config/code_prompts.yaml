      kinds:
        js_plugin: |
          Вид проекта — JS-плагин виджета: один файл .js, без разметки и тегов <script>. В
          CoGIS его вставляют в виджет «JavaScript-плагин» в Конструкторе приложения; код
          выполняется при каждом нажатии кнопки виджета. Плагин — сценарий из вызовов api:
          найти объекты в слое, приблизить карту, подсветить, открыть таблицу, показать
          сообщение. Как CoGIS подключает плагин, документация не описывает: сохраняй
          устройство файла проекта и не добавляй своих точек входа и обработчиков загрузки.
        html_widget: |
          Вид проекта — HTML-виджет: один файл .html. В CoGIS его вставляют в виджет
          «справочная информация в форме HTML-кода» в Конструкторе приложения; он
          показывается в окне или панели на карте. Это фрагмент страницы: разметка, стили в
          <style>, код в <script>, без <html>, <head> и <body>. Поля и кнопки связывай с
          кодом привязками Knockout data-bind (click, event, value), значение поля бери через
          jQuery — как в примерах документации CoGIS. Привязки применяет CoGIS: не вызывай
          ko.applyBindings.
        catalog: |
          Вид проекта — кастомизация Каталога карт: каждый файл — отдельная кастомизация на
          вкладке «HTML-кастомизация» папки Каталога карт или картографического приложения;
          .css — стили, .js — скрипт, .html — разметка. В .css и .js не пиши тегов <style> и
          <script> — CoGIS добавит их сам.
          Место вставки (начало или конец <head> или <body>) и типы клиента (смартфон,
          планшет, настольный ПК) сотрудник задаёт в настройках файла, а не в коде; новый
          файл получает: .css — конец <head>, .js и .html — конец <body>; нужно другое —
