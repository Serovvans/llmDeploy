          есть только у папок и задаётся в CoGIS; для всего Каталога — у Корневой папки.
          Блоки Каталога — элементы .catalog-items-container, папку или карту отличает
          атрибут data-block-id (например, "Folder_2"). Доступен ли api в кастомизации,
          документация не говорит — не используй его. Для 3D-моделей KML CoGIS вызывает
          функцию onCesiumKmlInit(kmlLayer) из скрипта кастомизации: в ней скрывают
          служебные метки и линии модели через kmlLayer.entities.values.
        card_hooks: |
