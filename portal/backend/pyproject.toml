[project]
name = "portal"
version = "0.1.0"
description = "Бэкенд портала сотрудников: вход, администрирование, чат с вложениями"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "asyncpg==0.31.0",
    "cryptography==50.0.2",
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "pillow==12.3.0",
    "pyotp==2.10.0",
    "pypdfium2==5.14.0",
    "python-docx==1.2.0",
    "python-multipart==0.0.32",
    "pyyaml==6.0.3",
    "segno==1.6.6",
    "sqlalchemy[asyncio]==2.1.3",
    "uvicorn==0.54.0",
]

[project.scripts]
portal = "portal.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portal"]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pixeltable-pgserver==0.6.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
    "types-pyyaml==6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "D", "T20"]
# RUF001-003: кириллица в строках и докстрингах — норма для проекта, а не «confusables»
ignore = ["D203", "D213", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"migrations/*" = ["D103"]

[tool.ruff.lint.flake8-bugbear]
# Вызовы FastAPI в значениях по умолчанию — штатный способ объявить зависимость.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "migrations"]
plugins = ["pydantic.mypy"]
mypy_path = "../dev/src"

[[tool.mypy.overrides]]
module = ["pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Заглушка модели из portal/dev — для сквозных тестов клиента Bifrost.
pythonpath = ["../dev/src"]
