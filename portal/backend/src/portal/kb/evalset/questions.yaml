    pages: [1]
    kind: exact
  # Целый номер встречается в выписке один раз, а его части — в каждой соседней по три.
  - text: Кто правообладатель участка 77:01:0004012:345?
    document: egrn-extract
    pages: [1, 2]
    kind: exact
  - text: Какой адрес у участка 77:01:0004012:346?
    document: egrn-346
    pages: [1]
    kind: exact
  # Латинская «A» вместо кириллической и пробелы вокруг дефиса.
  - text: Кто арендатор по договору 14 - A?
    document: lease-14a
    pages: [1]
    kind: exact
  - text: Что сдаётся в аренду по договору 14-Б?
