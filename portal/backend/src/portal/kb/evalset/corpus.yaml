documents:
  - id: lease-14a
    title: Договор аренды земельного участка № 14-А.pdf
    pages:
      - |
        ДОГОВОР № 14-А
        аренды земельного участка, находящегося в муниципальной собственности

        г. Видное, 12 марта 2024 года

        Комитет по управлению имуществом администрации Ленинского городского округа,
        именуемый в дальнейшем «Арендодатель», в лице председателя комитета Лаптева
        Сергея Николаевича, действующего на основании Положения, с одной стороны, и
        общество с ограниченной ответственностью «ЭнергоСетьСтрой», именуемое в
        дальнейшем «Арендатор», в лице генерального директора Мельниковой Ирины
        Павловны, действующей на основании Устава, с другой стороны, заключили
        настоящий договор о нижеследующем.

        1. Предмет договора
        1.1. Арендодатель предоставляет, а Арендатор принимает во временное владение и
        пользование земельный участок с кадастровым номером 50:21:0030210:417 площадью
        1 250 кв. м, расположенный по адресу: Московская область, Ленинский городской
        округ, деревня Сапроново, участок 8.
        1.2. Категория земель — земли населённых пунктов. Вид разрешённого
        использования — коммунальное обслуживание: размещение трансформаторной
        подстанции и опор линии электропередачи.
        1.3. Участок передаётся по акту приёма-передачи, который является неотъемлемой
        частью договора.
      - |
        2. Срок договора
        2.1. Участок предоставляется сроком на 49 (сорок девять) лет с даты
        государственной регистрации договора.
        2.2. Договор подлежит государственной регистрации в органе регистрации прав.
        Расходы по регистрации несёт Арендатор.

        3. Арендная плата
        3.1. Годовой размер арендной платы составляет 186 400 (сто восемьдесят шесть
        тысяч четыреста) рублей.
        3.2. Арендная плата вносится ежеквартально равными долями не позднее 15 числа
        последнего месяца квартала.
        3.3. Размер арендной платы может быть изменён Арендодателем в одностороннем
        порядке не чаще одного раза в год при изменении кадастровой стоимости участка
        или коэффициентов, установленных нормативными актами Московской области.
        3.4. За просрочку платежа Арендатор уплачивает пени в размере 0,1 % от
        невнесённой суммы за каждый день просрочки.
      - |
        4. Права и обязанности сторон
        4.1. Арендатор обязан использовать участок в соответствии с видом разрешённого
        использования, не допускать захламления территории и обеспечивать доступ
        представителям Арендодателя для осмотра участка.
        4.2. Передача участка в субаренду допускается только с письменного согласия
        Арендодателя.

        5. Расторжение договора
        5.1. Договор может быть расторгнут досрочно по требованию Арендодателя в
        судебном порядке, если Арендатор более двух раз подряд по истечении
        установленного срока не вносит арендную плату либо использует участок не по
        назначению.
        5.2. При прекращении договора Арендатор обязан в течение 30 дней освободить
        участок и вернуть его по акту в состоянии, пригодном для дальнейшего
        использования.
        5.3. Споры рассматриваются в Арбитражном суде Московской области.

