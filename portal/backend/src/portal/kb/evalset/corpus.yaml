  - id: postgis-guide
    title: Памятка по пространственным запросам PostGIS.md
    pages:
      - |
        # Системы координат и площади

        Геометрии участков в базе хранятся в системе координат EPSG:4326 (широта и
        долгота в градусах). Считать площадь и длину прямо по таким координатам
        нельзя: результат получится в «квадратных градусах».

        Есть два правильных способа:
        - привести геометрию к типу geography: `ST_Area(geom::geography)` вернёт
          площадь в квадратных метрах на эллипсоиде;
        - перепроецировать в метрическую систему координат региона функцией
          `ST_Transform`, например в зону МСК-50 или в подходящую зону UTM, и считать
          площадь уже в ней.

        Проекцию Web Mercator (EPSG:3857) для расчёта площадей не используют: на
        широте Москвы она завышает площадь примерно в три раза.

        Если у геометрии не задан идентификатор системы координат (SRID равен нулю),
        сначала назначьте его функцией `ST_SetSRID` — она не пересчитывает координаты,
        а только ставит метку.
      - |
        # Пространственные индексы и поиск соседей

        Запросы «что пересекается с участком» и «что находится рядом» быстро работают
        только при наличии индекса GiST по столбцу геометрии:

        ```sql
        CREATE INDEX parcels_geom_gix ON parcels USING GIST (geom);
        ```

        После массовой загрузки данных выполните `ANALYZE parcels`, иначе
        планировщик может не воспользоваться индексом.

        Чтобы найти объекты в радиусе, используйте `ST_DWithin(a.geom, b.geom, 100)`,
        а не сравнение `ST_Distance(a.geom, b.geom) < 100`: первая функция
        использует индекс, вторая считает расстояние для каждой пары строк.

        `ST_Intersects` возвращает истину и для участков, которые только касаются
        общей границей. Если нужны настоящие наложения, сравнивайте площадь
        пересечения: `ST_Area(ST_Intersection(a.geom, b.geom)) > 0.5`.
      - |
        # Исправление некорректных геометрий

        Перед анализом проверьте геометрии: `SELECT id FROM parcels WHERE NOT
        ST_IsValid(geom)`. Причину покажет `ST_IsValidReason` — чаще всего это
        самопересечение контура или совпадающие вершины.

        Исправить геометрию можно функцией `ST_MakeValid`. Она может превратить
        полигон в коллекцию из полигона и линии, поэтому после исправления оставьте
        только полигональную часть: `ST_CollectionExtract(ST_MakeValid(geom), 3)`.

        Приём с нулевым буфером `ST_Buffer(geom, 0)` тоже убирает самопересечения, но
        может молча отбросить часть контура — пользуйтесь им только после проверки
        площади до и после.

        Ошибка «TopologyException: Input geom 1 is invalid» при вызове
        `ST_Intersection` или `ST_Union` означает именно некорректную геометрию во
        входных данных.

  - id: plugin-guide
    title: Руководство по разработке серверных плагинов (учебный пример).pdf
    pages:
      - |
        Руководство по разработке серверных плагинов
        Учебный пример для контрольного набора; имена интерфейсов условные.

        1. Структура плагина
        Плагин — это библиотека классов .NET, в которой есть класс, реализующий
        интерфейс IServerPlugin. Сервер создаёт один экземпляр класса при запуске и
        вызывает метод Initialize, передавая контекст с настройками и журналом.

        Рядом с библиотекой лежит файл описания plugin.json. В нём указываются
        идентификатор плагина, версия, имя сборки и минимальная версия сервера.
        Плагин, у которого минимальная версия сервера выше установленной, не
        загружается, а в журнал пишется предупреждение.

        Каталог плагина копируется в папку Plugins сервера; после копирования службу
        нужно перезапустить — горячая подгрузка не поддерживается.
      - |
        2. Обработчики запросов
        Чтобы плагин отвечал на запросы, зарегистрируйте обработчик в методе
        Initialize: context.Routes.MapGet("/parcels/{id}", GetParcel). Обработчик
        получает параметры запроса и возвращает объект, который сервер сам
        сериализует в JSON.

        Обработчики выполняются в пуле потоков, поэтому общие поля класса защищайте
        блокировкой или используйте потокобезопасные коллекции. Длительные операции
        (выгрузка, пересчёт геометрии) запускайте как фоновую задачу через
        context.Jobs.Enqueue и возвращайте клиенту идентификатор задачи.

        Подключение к базе данных берите из context.Database: строка подключения
        хранится в настройках сервера, и записывать её в код плагина нельзя.
      - |
        3. Типичные ошибки сборки и загрузки
        Ошибка CS0246 «Не удалось найти тип или имя пространства имён
        IServerPlugin» означает, что в проект не добавлена ссылка на библиотеку
        Server.Sdk.dll из каталога установки сервера.

        Ошибка CS0535 «Класс не реализует член интерфейса» появляется после
        обновления сервера, если в интерфейс добавили новый метод: реализуйте его
        или унаследуйте класс от ServerPluginBase, где есть реализации по умолчанию.

        Если сборка прошла, но плагина нет в списке, проверьте журнал сервера:
        сообщение «manifest not found» говорит о том, что plugin.json не скопирован в
        выходной каталог. В свойствах файла укажите «Копировать в выходной каталог:
        всегда».

        Исключение BadImageFormatException при загрузке означает несовпадение
        разрядности: соберите плагин под x64.

  - id: backup-regulation
    title: Регламент резервного копирования сервера ГИС.docx
    pages:
      - |
        РЕГЛАМЕНТ
        резервного копирования и восстановления сервера геоинформационной системы

        1. Что копируется
        Резервному копированию подлежат: база данных пространственных объектов,
        каталог пользовательских файлов и каталог конфигурации сервера. Кэш тайлов не
        копируется: он восстанавливается пересчётом.

        2. Расписание
        Полная копия базы данных создаётся ежедневно в 02:30 утилитой pg_dump в
        формате custom. Каталоги файлов копируются инкрементально каждые шесть часов.
        Копии хранятся 14 дней на отдельном сетевом хранилище; копия на первое число
        месяца хранится один год.

        3. Ответственный
        Ответственный за резервное копирование — ведущий инженер Орлов Павел
        Андреевич; в его отсутствие — дежурный администратор.
      - |
        4. Проверка восстановления
        Раз в квартал ответственный восстанавливает последнюю полную копию на
        тестовом сервере и сверяет число объектов в основных слоях с рабочей базой.
        Результат проверки записывается в журнал регламентных работ.

        5. Обновление сервера
        Перед установкой обновления создаётся внеочередная полная копия. Обновление
        устанавливается в технологическое окно — по субботам с 20:00 до 24:00.
        Если после обновления сервер не проходит проверку работоспособности в
        течение 30 минут, выполняется откат на предыдущую версию из копии.

        6. Действия при сбое копирования
        При двух неудачных попытках подряд дежурный администратор уведомляет
        ответственного и руководителя отдела; причина сбоя и принятые меры
        фиксируются в журнале в тот же день.

