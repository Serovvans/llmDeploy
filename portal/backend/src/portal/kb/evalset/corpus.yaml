        Об утверждении схемы расположения земельного участка на кадастровом плане
        территории

        Рассмотрев заявление Петрова Алексея Сергеевича от 2 апреля 2024 года, в
        соответствии со статьёй 11.10 Земельного кодекса Российской Федерации,
        администрация постановляет:

        1. Утвердить схему расположения земельного участка площадью 842 кв. м в
        кадастровом квартале 50:21:0030210, образуемого из земель, государственная
        собственность на которые не разграничена, по адресу: Московская область,
        Ленинский городской округ, деревня Сапроново, вблизи дома 21.
        2. Установить категорию земель — земли населённых пунктов, вид разрешённого
        использования — для ведения личного подсобного хозяйства (приусадебный
        земельный участок).
      - |
        3. Петрову А. С. обеспечить проведение кадастровых работ и постановку
        земельного участка на государственный кадастровый учёт.
        4. Срок действия настоящего постановления составляет два года со дня его
        принятия. Если в течение этого срока участок не поставлен на кадастровый учёт,
        постановление утрачивает силу.
        5. Отделу градостроительства в течение пяти рабочих дней направить
        постановление с приложением схемы в орган регистрации прав.
        6. Контроль за исполнением постановления возложить на заместителя главы
        администрации Дорохова В. И.

        Глава городского округа                                   Н. П. Ермаков

