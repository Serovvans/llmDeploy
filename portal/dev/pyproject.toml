[project]
name = "llm-stub"
version = "0.1.0"
description = "Заглушка OpenAI-совместимого API для стенда портала без GPU (docs/portal-api.md §12.2)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "starlette==1.7.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_stub"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "D", "T20"]
# RUF001-003: кириллица в строках и докстрингах — норма для проекта, а не «confusables»
ignore = ["D203", "D213", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
