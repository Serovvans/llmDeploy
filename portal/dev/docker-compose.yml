# Стенд портала без GPU (docs/portal-design.md §9): тот же набор сервисов, что в профиле
# portal на ВМ, но вместо Bifrost и vLLM — заглушка под именем bifrost
# (docs/portal-api.md §12.2); она же отвечает за реранкер. Песочница SQL — настоящая.
# Открывается как https://localhost:8443: cookie сессии
# всегда Secure, а сертификат выпускает собственный CA Caddy (браузер предупредит).
# Определения сервисов повторяют deploy/docker-compose.yml: при правке там — править и здесь.

name: portal-dev

# Те же параметры журналов, что в deploy/docker-compose.yml.
x-logging: &logging
  driver: json-file
  options:
    max-size: 50m
    max-file: "5"

services:
  caddy:
    image: caddy:2.11.4
    restart: unless-stopped
    logging: *logging
    depends_on:
      bifrost:
        condition: service_healthy
      portal-api:
        condition: service_healthy
      portal-web:
        condition: service_healthy
    ports:
      # Только loopback и не 443: стенд не должен быть виден из сети разработчика.
      - "127.0.0.1:8443:443/tcp"
    environment:
      LLM_HOSTNAME: localhost
      TLS_MODE: internal
      SITE_MODE: portal
    volumes:
      # Рабочий Caddyfile, а не копия: стенд проверяет те же маршруты и заголовки, что на ВМ.
      - ../../deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Корень CA переживает пересоздание контейнера: исключение в браузере не слетает.
      - caddy-data:/data
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  bifrost:
    build: .
    restart: unless-stopped
    logging: *logging
    networks:
      - edge
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  portal-web:
    build: ../frontend
    restart: unless-stopped
    logging: *logging
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  portal-api:
    build: ../backend
    restart: unless-stopped
    logging: *logging
    depends_on:
      portal-db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      PORTAL_DB_PASSWORD: ${PORTAL_DB_PASSWORD:?}
      PORTAL_SECRET_KEY: ${PORTAL_SECRET_KEY:?}
      PORTAL_LLM_API_KEY: ${PORTAL_LLM_API_KEY:?}
      QDRANT_API_KEY: ${QDRANT_API_KEY:?}
      # Контекст настоящей модели (docs/portal-api.md §13.5).
      MAX_MODEL_LEN: "65536"
      SQL_SANDBOX_PASSWORD: ${SQL_SANDBOX_PASSWORD:?}
      SQL_SANDBOX_CONTROL_PASSWORD: ${SQL_SANDBOX_CONTROL_PASSWORD:?}
    # Тот же предел, что на ВМ: на него опираются проверки чтения из песочницы.
    mem_limit: 4g
    memswap_limit: 4g
    volumes:
      - portal-files:/data/files
      - ./config.override.yaml:/etc/portal/config.override.yaml:ro
      - cogis-sdk-index:/data/cogis-sdk-index:ro
    networks:
      - edge
      - portal
      - sandbox
      - code-sandbox
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s

  portal-worker:
    # Тот же образ, что у portal-api, с другой командой (docs/portal-design.md §3).
    build: ../backend
    restart: unless-stopped
    logging: *logging
    command: ["portal", "worker"]
    # По SIGTERM воркер возвращает взятые задания в очередь; разбор PDF в потоке
    # прервать нельзя, и стандартных 10 с на это не хватает.
    stop_grace_period: 30s
    depends_on:
      # Миграции применяет portal-api: воркер стартует, когда схема уже готова.
      portal-api:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      # PORTAL_SECRET_KEY сюда не передаётся: ключ второго фактора нужен только portal-api.
      PORTAL_DB_PASSWORD: ${PORTAL_DB_PASSWORD:?}
      PORTAL_LLM_API_KEY: ${PORTAL_LLM_API_KEY:?}
      QDRANT_API_KEY: ${QDRANT_API_KEY:?}
    # Как на ВМ: стенд проверяет, что воркер без привилегий стартует и обрабатывает
    # документ и запись (docs/portal-api.md §13.5). Пределов CPU и памяти здесь нет:
    # значения ВМ (10 CPU) Docker отвергает на машине с меньшим числом ядер.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      core: 0
    volumes:
      - portal-files:/data/files
      - ./config.override.yaml:/etc/portal/config.override.yaml:ro
      # Пуст, пока на стенде подмена модели речи (media.asr.engine: stub); для настоящей
      # модели веса кладут в этот том.
      - asr-models:/models/asr:ro
    networks:
      # edge — только ради Bifrost: распознавание сканов и эмбеддинги.
      - edge
      - portal
    healthcheck:
      test: ["CMD", "portal", "worker-health"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s

  portal-db:
    image: postgres:16.15-bookworm
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: portal
      POSTGRES_DB: portal
      POSTGRES_PASSWORD: ${PORTAL_DB_PASSWORD:?}
    volumes:
      - portal-db-data:/var/lib/postgresql/data
    networks:
      - portal
    healthcheck:
      # По TCP: во время первой инициализации временный сервер слушает только сокет.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "portal", "-d", "portal"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    logging: *logging
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?}
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - portal
    healthcheck:
      # В образе нет curl/wget, но есть bash с /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Тот же образ и те же ограничения, что на ВМ: проверки изоляции песочницы
  # (docs/portal-design.md §10, п. 18) идут на стенде.
  sql-sandbox:
    build: ../../deploy/sql-sandbox
    restart: unless-stopped
    logging: *logging
    environment:
      SQL_SANDBOX_PASSWORD: ${SQL_SANDBOX_PASSWORD:?}
      SQL_SANDBOX_CONTROL_PASSWORD: ${SQL_SANDBOX_CONTROL_PASSWORD:?}
      SQL_SANDBOX_ROLES: "2"
    read_only: true
    tmpfs:
      - /var/lib/postgresql/data:size=256m,uid=999,gid=999,mode=0700,noexec,nosuid,nodev
      - /var/run/postgresql:size=1m,uid=999,gid=999,mode=0775,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      core: 0
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    pids_limit: 64
    networks:
      - sandbox
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "sandbox_ctl", "-d", "sandbox"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Песочница сборки — тот же образ и те же ограничения, что на ВМ (проверки изоляции,
  # CLAUDE.md, пайплайн «Код», правило 2), плюс заглушка SDK в /stub-sdk. Настоящие DLL
  # в deploy/cogis-sdk/ (вне git) важнее заглушки; выбор — один и тот же в обоих сервисах.
  # Индекс строится заново при каждом запуске стенда — как make cogis-sdk на ВМ.
  code-sandbox-index:
    image: portal-dev-code-sandbox:stand
    build:
      context: ../code-sandbox
      target: stand
    logging: *logging
    entrypoint: ["sh", "-c"]
    command: ["if [ -f /sdk/eLiteGIS.Server.dll ]; then d=/sdk; else d=/stub-sdk; fi; exec /app/code-sandbox index --sdk \"$$d\" --out /index"]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../../deploy/cogis-sdk:/sdk:ro
      - cogis-sdk-index:/index

  code-sandbox:
    image: portal-dev-code-sandbox:stand
    build:
      context: ../code-sandbox
      target: stand
    restart: unless-stopped
    logging: *logging
    depends_on:
      code-sandbox-index:
        condition: service_completed_successfully
    # Манифест сверяется с той папкой, по которой построен индекс.
    entrypoint: ["sh", "-c"]
    command: ["if [ -f /sdk/eLiteGIS.Server.dll ]; then d=/sdk; else d=/stub-sdk; fi; export Sandbox__SdkDir=\"$$d\"; exec /app/code-sandbox serve"]
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      core: 0
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    pids_limit: 256
    volumes:
      - ../../deploy/cogis-sdk:/sdk:ro
      - cogis-sdk-index:/index:ro
      # Пуст, пока в него не загружен офлайн-набор: сборка с пакетами — unknown_package.
      - code-packages:/packages:ro
    networks:
      - code-sandbox
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  edge:
  portal:
    internal: true
  sandbox:
    internal: true
  code-sandbox:
    internal: true

volumes:
  caddy-data:
  portal-db-data:
  qdrant-data:
  portal-files:
  asr-models:
  cogis-sdk-index:
  code-packages:
