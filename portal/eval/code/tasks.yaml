- id: fix-type-mismatch
  group: fix
  project:
    name: HouseCounter
    packages: [Npgsql]
    files:
      GpToolFactory.cs: |
        using System;
        using eLiteGIS.Geoprocessing;

        namespace HouseCounter
        {
            public sealed class GpToolFactory : IGpToolFactory
            {
                public Type[] GetToolTypes()
                {
                    return new Type[] { typeof(CountHousesTool) };
                }
            }
        }
      CountHousesTool.cs: |
        using System;
        using Atemiko.eLiteMap.Geodatabase;
        using eLiteGIS.Geoprocessing;
        using eLiteGIS.Utilities;
        using Npgsql;

        namespace HouseCounter
        {
            [GpToolIcon("fa fa-home")]
            [GpCategory("Статистика")]
            [GpDescription("Число домов на улице", "Houses on street")]
            public sealed class CountHousesTool : GpTool
            {
                [GpRequired]
                [GpDescription("Улица", "Street")]
                public string? Street { get; set; }

                [GpRequired]
                [GpDescription("Подключение к базе", "Database connection")]
                public Workspace? TargetWorkspace { get; set; }

                [GpDescription("Число домов", "Houses count")]
                public string? Result { get; private set; }

                public override void ValidateInput()
                {
                    if (string.IsNullOrWhiteSpace(Street))
                    {
                        throw new UserException("Не задана улица.");
                    }
                }

                public override void InnerExecute()
                {
                    using var connection = new NpgsqlConnection(GetConnectionString());
                    connection.Open();
                    using var command = new NpgsqlCommand(
                        "SELECT count(*) FROM addresses WHERE street = @street", connection);
                    command.Parameters.AddWithValue("street", Street!.Trim());
                    long count = command.ExecuteScalar();
                    Result = count;
                }

                private string GetConnectionString()
                {
                    var properties = TargetWorkspace?.WorkspaceName?.ConnectionProperties
                        ?? throw new UserException("Не задано подключение к базе данных.");
                    if (properties.TryGetValue(WorkspaceName.PropertyNames.ConnectionString, out var value)
                        && value is string connectionString
                        && !string.IsNullOrWhiteSpace(connectionString))
                    {
                        return connectionString;
                    }

                    throw new UserException("В подключении к базе нет строки подключения.");
                }
            }
        }
  schema: null
  action: fix
  request: Исправить ошибки сборки

