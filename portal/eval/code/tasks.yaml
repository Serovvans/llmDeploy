      CheckNumberTool.cs: |
        using System;
        using System.Text.RegularExpressions;
        using eLiteGIS.Geoprocessing;
        using eLiteGIS.Utilities;

        namespace CadastreCheck
        {
            [GpToolIcon("fa fa-check")]
            [GpCategory("Кадастр")]
            [GpDescription("Проверить кадастровый номер", "Check cadastral number")]
            public sealed class CheckNumberTool : GpTool
            {
                [GpRequired]
                [GpDescription("Кадастровый номер", "Cadastral number")]
                public string? Number { get; set; }

                [GpDescription("Проверка", "Check result")]
                public string? Result { get; private set; }

                public override void ValidateInput()
                {
                    if (string.IsNullOrWhiteSpace(Number))
                    {
                        throw new UserException("Не задан кадастровый номер.");
                    }
                }

                public override void InnerExecute()
                {
                    var valid = Regex.IsMatch(Number!.Trim(), @"^\d{2}:\d{2}:\d{6,7}:\d+$");
                    Result = valid ? "Номер верный." : "Номер записан неверно.";
                }
            }
        }
      BlockFromNumberTool.cs: |
        using System;
        using eLiteGIS.Geoprocessing;
        using eLiteGIS.Utilities;

        namespace CadastreCheck
        {
            [GpToolIcon("fa fa-th")]
            [GpCategory("Кадастр")]
            [GpDescription("Квартал по кадастровому номеру", "Block from cadastral number")]
            public sealed class BlockFromNumberTool : GpTool
            {
                [GpRequired]
                [GpDescription("Кадастровый номер", "Cadastral number")]
                public string? Number { get; set; }

                [GpDescription("Кадастровый квартал", "Cadastral block")]
                public string? Result { get; private set; }

                public override void ValidateInput()
                {
                    if (string.IsNullOrWhiteSpace(Number) || Number.Split(':').Length != 4)
                    {
                        throw new UserException("Кадастровый номер должен состоять из четырёх частей через двоеточие.");
                    }
                }

                public override void InnerExecute()
                {
                    var parts = Number!.Trim().Split(':');
                    Result = string.Join(":", parts[0], parts[1], parts[2]);
                }
            }
        }
