# ---------------------------------------------------------------- исправление сборки
- id: fix-missing-using
  group: fix
  project:
    name: RoadRepair
    packages: [Npgsql]
    files:
      GpToolFactory.cs: |
        using System;
        using eLiteGIS.Geoprocessing;

        namespace RoadRepair
        {
            public sealed class GpToolFactory : IGpToolFactory
            {
                public Type[] GetToolTypes()
                {
                    return new Type[] { typeof(CloseRepairTool) };
                }
            }
        }
      CloseRepairTool.cs: |
        using System;
        using Atemiko.eLiteMap.Geodatabase;
        using eLiteGIS.Geoprocessing;
        using eLiteGIS.Utilities;

        namespace RoadRepair
        {
            [GpToolIcon("fa fa-road")]
            [GpCategory("Дороги")]
            [GpDescription("Закрыть заявку на ремонт", "Close repair request")]
            public sealed class CloseRepairTool : GpTool
            {
                [GpRequired]
                [GpDescription("Номер заявки", "Request number")]
                public string? RequestNumber { get; set; }

                [GpRequired]
                [GpDescription("Подключение к базе", "Database connection")]
                public Workspace? TargetWorkspace { get; set; }

                [GpDescription("Результат выполнения", "Execution result")]
                public string? Result { get; private set; }

                public override void ValidateInput()
                {
                    if (string.IsNullOrWhiteSpace(RequestNumber))
                    {
                        throw new UserException("Не задан номер заявки.");
                    }
                }

                public override void InnerExecute()
                {
                    using var connection = new NpgsqlConnection(GetConnectionString());
                    connection.Open();
                    using var command = new NpgsqlCommand(
                        "UPDATE repair_requests SET status = 'closed', closed_at = now() WHERE number = @number",
                        connection);
                    command.Parameters.AddWithValue("number", RequestNumber!.Trim());
                    var updated = command.ExecuteNonQuery();
                    Result = updated == 0 ? "Заявка не найдена." : "Заявка закрыта.";
                }

                private string GetConnectionString()
                {
                    var properties = TargetWorkspace?.WorkspaceName?.ConnectionProperties
                        ?? throw new UserException("Не задано подключение к базе данных.");
                    if (properties.TryGetValue(WorkspaceName.PropertyNames.ConnectionString, out var value)
                        && value is string connectionString
                        && !string.IsNullOrWhiteSpace(connectionString))
                    {
                        return connectionString;
                    }

                    throw new UserException("В подключении к базе нет строки подключения.");
                }
            }
        }
  schema: null
  action: fix
  request: Исправить ошибки сборки

- id: fix-tool-not-in-factory
  group: fix
  project:
    name: CadastreCheck
    packages: []
    files:
