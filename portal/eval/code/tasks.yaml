# Контрольный набор раздела «Код» (docs/portal-design.md §5.4, §10 п. 38;
# формат — docs/portal-api.md §13.4). Ведёт codegen-evaluator.
#
# Прогон: `portal eval-code --set <каталог> [--out <файл.json>]` в контейнере portal-api
# (тот же путь, что у сотрудника: каркас → вопрос помощнику → правка → сборка → цикл
# исправления). Сравнение двух прогонов: `python compare.py было.json стало.json`.
#
# Поля задачи — по контракту. `request: null` у задач мастера — вопросом служит
# assistant_request мастера (code.prompts.wizard_request и описания инструментов), как у
# сотрудника. Ожидаемое сверх итога сборки (обязательные обращения к API, запрещённые
# конструкции) — в expect.yaml; задачи «Объяснить» — в explain.yaml.

# ---------------------------------------------------------------- база данных
- id: db-street-search
  group: database
  project:
    wizard:
      name: StreetSearch
      tools:
        - title_ru: Найти улицы по названию
          title_en: Find streets by name
          category: Адреса
          icon: fa fa-search
          uses_database: true
          description: >-
            Сотрудник вводит часть названия улицы, например «Лен». Нужно найти в таблице
            streets все улицы, в названии которых есть этот текст, без учёта больших и
            маленьких букв, и выдать их названия через запятую по алфавиту, не больше 50.
            Если ничего не нашлось — так и написать.
          inputs:
            - { name: NamePart, type: string, required: true, title_ru: Часть названия, title_en: Name part }
          outputs:
            - { name: Result, type: string, title_ru: Найденные улицы, title_en: Found streets }
  schema: |
    CREATE TABLE streets (
        id serial PRIMARY KEY,
        name text NOT NULL,
        district text
    );
  action: write
  request: null

- id: db-permit-status
  group: database
  project:
    wizard:
      name: PermitDesk
      tools:
        - title_ru: Сменить статус разрешения
          title_en: Change permit status
          category: Разрешения
          icon: fa fa-check-square-o
          uses_database: true
          description: >-
            По номеру разрешения на строительство меняем его статус в таблице permits и
            ставим время изменения. Допустимые статусы: «на рассмотрении», «выдано»,
            «отказано» — другой статус не принимать, а сказать сотруднику, какие можно.
            Если разрешения с таким номером нет — сообщить об этом.
          inputs:
            - { name: PermitNumber, type: string, required: true, title_ru: Номер разрешения, title_en: Permit number }
            - { name: NewStatus, type: string, required: true, title_ru: Новый статус, title_en: New status }
          outputs:
            - { name: Result, type: string, title_ru: Результат, title_en: Result }
  schema: |
    CREATE TABLE permits (
        number text PRIMARY KEY,
        status text NOT NULL,
        updated_at timestamptz
    );
  action: write
  request: null

- id: db-buildings-count
  group: database
  project:
    wizard:
      name: BuildingStats
      tools:
        - title_ru: Число домов в районе
          title_en: Buildings in district
          category: Статистика
          icon: fa fa-building
          uses_database: true
          description: >-
            Посчитать, сколько домов в выбранном районе и сколько из них выше заданной
            этажности. Данные — в таблице buildings. Ответ одной строкой, например
            «В районе Центральный 120 домов, выше 9 этажей — 15».
          inputs:
            - { name: District, type: string, required: true, title_ru: Район, title_en: District }
            - { name: MinFloors, type: int, required: true, title_ru: Этажей больше чем, title_en: Floors above }
          outputs:
            - { name: Result, type: string, title_ru: Итог, title_en: Summary }
  schema: |
    CREATE TABLE buildings (
        id serial PRIMARY KEY,
        district text NOT NULL,
        address text NOT NULL,
        floors integer
    );
  action: write
  request: null

- id: db-purge-events
  group: database
  project:
    wizard:
      name: EventCleanup
      tools:
        - title_ru: Удалить старые события журнала
          title_en: Purge old events
          category: Обслуживание
          icon: fa fa-trash
          uses_database: true
          description: >-
            Удалить из таблицы events записи старше заданного числа дней. Меньше 30 дней
            удалять нельзя — сказать об этом. В результате написать, сколько записей
            удалено.
          inputs:
            - { name: Days, type: int, required: true, title_ru: Старше дней, title_en: Older than days }
          outputs:
            - { name: Result, type: string, title_ru: Результат, title_en: Result }
  schema: |
    CREATE TABLE events (
        id bigserial PRIMARY KEY,
        created_at timestamptz NOT NULL DEFAULT now(),
        message text
    );
  action: write
  request: null

- id: db-appeal-register
  group: database
  project:
    wizard:
      name: Appeals
      tools:
        - title_ru: Зарегистрировать обращение
          title_en: Register appeal
          category: Обращения граждан
          icon: fa fa-inbox
          uses_database: true
          description: >-
            Записать обращение жителя в таблицу appeals: имя, телефон и текст обращения.
            Телефон оставить только цифрами, их должно быть 10 или 11. В результате
            выдать номер, который база присвоила обращению.
          inputs:
            - { name: ApplicantName, type: string, required: true, title_ru: Имя заявителя, title_en: Applicant name }
            - { name: Phone, type: string, required: true, title_ru: Телефон, title_en: Phone }
            - { name: AppealText, type: string, required: true, title_ru: Текст обращения, title_en: Appeal text }
          outputs:
            - { name: Result, type: string, title_ru: Номер обращения, title_en: Appeal number }
  schema: |
    CREATE TABLE appeals (
        id serial PRIMARY KEY,
        applicant text NOT NULL,
        phone text NOT NULL,
        body text NOT NULL,
        created_at timestamptz NOT NULL DEFAULT now()
    );
  action: write
  request: null

- id: db-contact-duplicate
  group: database
  project:
    example: ContactBook
  schema: |
    CREATE TABLE contacts (
        id serial PRIMARY KEY,
        organization text NOT NULL,
        email text NOT NULL
    );
  action: write
  request: >-
    Перед добавлением проверьте, нет ли уже в таблице contacts такого email (большие и
    маленькие буквы не важны). Если есть — ничего не добавлять, а в результате написать,
    что такой контакт уже есть и у какой организации.

# ---------------------------------------------------------------- геометрия
- id: geo-parcel-area
  group: geometry
  project:
    wizard:
      name: ParcelArea
      tools:
        - title_ru: Площадь участка
          title_en: Parcel area
          category: Кадастр
          icon: fa fa-map
          uses_database: true
          description: >-
            По кадастровому номеру найти участок в таблице parcels и посчитать его площадь
            в гектарах с двумя знаками после запятой. Геометрия хранится в проекции 3857,
            площадь нужна настоящая, на местности. Нет участка — так и сказать.
          inputs:
            - { name: CadastralNumber, type: string, required: true, title_ru: Кадастровый номер, title_en: Cadastral number }
          outputs:
            - { name: Result, type: string, title_ru: Площадь, title_en: Area }
  schema: |
    -- PostGIS
    CREATE TABLE parcels (
        cad_number text PRIMARY KEY,
        address text,
        geom geometry(MultiPolygon, 3857) NOT NULL
    );
  action: write
  request: null

- id: geo-poi-radius
  group: geometry
  project:
    wizard:
      name: NearbyObjects
      tools:
        - title_ru: Объекты рядом с точкой
          title_en: Objects near point
          category: Поиск
          icon: fa fa-crosshairs
          uses_database: true
          description: >-
            Сотрудник вводит широту, долготу и радиус в метрах. Найти в таблице poi объекты
            в этом радиусе и выдать их названия с расстоянием в метрах, от ближайшего,
            не больше 20 штук. Радиус больше 10 км не принимать.
          inputs:
            - { name: Latitude, type: double, required: true, title_ru: Широта, title_en: Latitude }
            - { name: Longitude, type: double, required: true, title_ru: Долгота, title_en: Longitude }
            - { name: RadiusMeters, type: double, required: true, title_ru: "Радиус, м", title_en: "Radius, m" }
          outputs:
            - { name: Result, type: string, title_ru: Найденные объекты, title_en: Found objects }
  schema: |
    -- PostGIS
    CREATE TABLE poi (
        id serial PRIMARY KEY,
        name text NOT NULL,
        kind text,
        geom geometry(Point, 4326) NOT NULL
    );
  action: write
  request: null

- id: geo-zone-by-point
  group: geometry
  project:
    wizard:
      name: ZoneLookup
      tools:
        - title_ru: Зона по координатам
          title_en: Zone by coordinates
          category: Градостроительство
          icon: fa fa-map-marker
          uses_database: true
          description: >-
            По широте и долготе определить, в какую территориальную зону из таблицы zones
            попадает точка, и выдать код и название зоны. Если точка не попала ни в одну
            зону — сообщить. Широта от -90 до 90, долгота от -180 до 180.
          inputs:
            - { name: Latitude, type: double, required: true, title_ru: Широта, title_en: Latitude }
            - { name: Longitude, type: double, required: true, title_ru: Долгота, title_en: Longitude }
          outputs:
            - { name: Result, type: string, title_ru: Зона, title_en: Zone }
  schema: |
    -- PostGIS
    CREATE TABLE zones (
        code text PRIMARY KEY,
        title text NOT NULL,
        geom geometry(MultiPolygon, 4326) NOT NULL
    );
  action: write
  request: null

- id: geo-distance-calc
  group: geometry
  project:
    wizard:
      name: GeoDistance
      tools:
