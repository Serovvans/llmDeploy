            - { name: Longitude1, type: double, required: true, title_ru: Долгота первой точки, title_en: Longitude 1 }
            - { name: Latitude2, type: double, required: true, title_ru: Широта второй точки, title_en: Latitude 2 }
            - { name: Longitude2, type: double, required: true, title_ru: Долгота второй точки, title_en: Longitude 2 }
          outputs:
            - { name: Result, type: string, title_ru: "Расстояние, км", title_en: "Distance, km" }
