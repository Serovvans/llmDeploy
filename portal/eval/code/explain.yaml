# Задачи «Объяснить» (action: explain) — предложение к контракту (docs/portal-api.md
# §13.4 знает только write и fix), см. отчёт codegen-evaluator. Сборки у них нет: итог —
# ответ без блоков правки, где находятся все выражения `mentions` (регулярные, Python
# `re`, без учёта регистра). Поля project, schema, request — как в tasks.yaml; `target` —
# путь файла проекта и строки выделения с 1 включительно (`null` — без выделения).

- id: explain-example-file
  group: explain
  project:
    example: ContactBook
  schema: null
  action: explain
  target: { path: AddContactTool.cs, start_line: 1, end_line: 87 }
  request: Объяснить файл AddContactTool.cs
  mentions: ['contacts', 'email|почт', 'организаци', 'ошибк']

- id: explain-connection-fragment
  group: explain
  project:
    example: ContactBook
  schema: null
  action: explain
