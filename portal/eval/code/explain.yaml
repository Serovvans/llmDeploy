  request: Объяснить выделенный фрагмент
  mentions: ['подключени', 'сервер|host', 'парол']

- id: explain-bad-email
  group: explain
  project:
    example: ContactBook
  schema: null
  action: explain
  target: null
  request: Что увидит сотрудник в CoGIS, если введёт email без значка @? Запишется ли что-нибудь в базу?
